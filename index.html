<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Creative Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#15131C; --surface:#1F1B29; --surface-2:#2A2536; --line:#3B3548;
  --text:#F1EEF8; --muted:#AAA4BD; --primary:#FFC857; --on-primary:#1A1405;
  --warn-bg:rgba(255,200,87,.12); --shadow:0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="dark"]{
  --bg:#15131C; --surface:#1F1B29; --surface-2:#2A2536; --line:#3B3548;
  --text:#F1EEF8; --muted:#AAA4BD; --primary:#FFC857; --on-primary:#1A1405;
  --warn-bg:rgba(255,200,87,.12); --shadow:0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#ECEDF6; --line:#D3D6E8;
  --text:#1B1830; --muted:#5A5675; --primary:#3D2BD9; --on-primary:#FFFFFF;
  --warn-bg:rgba(61,43,217,.08); --shadow:0 8px 30px rgba(40,30,120,.10);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:92px;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
a{color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ic{flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:auto}
.mark{width:34px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.dnav{display:none;gap:4px}
.dnav a{padding:10px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:500}
.dnav a:hover{background:var(--surface-2);color:var(--text)}
.dnav a[aria-current="page"]{background:var(--surface-2);color:var(--text)}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--surface-2)}
.fav[aria-pressed="true"]{color:var(--primary)}
.fav[aria-pressed="true"] svg{fill:currentColor}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500}
.bnav a[aria-current="page"]{color:var(--primary)}
@media(min-width:760px){.dnav{display:flex}.bnav{display:none}body{padding-bottom:40px}}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 'Instrument Sans',system-ui,sans-serif;border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer;text-decoration:none;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;font-size:16px;width:100%}

/* hero */
.hero{display:grid;gap:28px;padding:34px 0 18px}
.hero h1{font-size:clamp(34px,7vw,60px);max-width:14ch}
.hero .sub{color:var(--muted);font-size:18px;max-width:46ch;margin-top:14px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.demo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--da,var(--primary));transition:background .3s}
.demo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-left:6px}
.demo-tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 14px 'Instrument Sans',system-ui,sans-serif;cursor:pointer}
.demo-tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--text);border-color:var(--da,var(--primary))}
.demo-idea{padding-left:6px;color:var(--muted);font-size:14px;margin-bottom:8px}
.demo-idea b{color:var(--text);font-weight:600}
.demo pre{margin:0 0 0 6px;white-space:pre-wrap;word-break:break-word;font:400 14px/1.65 'JetBrains Mono',ui-monospace,Menlo,monospace;min-height:7.6em;animation:fade .45s ease}
.demo-note{padding-left:6px;margin-top:10px;color:var(--muted);font-size:13px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:860px){.hero{grid-template-columns:1.05fr 1fr;align-items:center;padding:56px 0 28px}}

/* toolbar */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sec-h h2{font-size:26px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.tabs button{flex:1;min-height:48px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:600 15px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.search{position:relative;margin-top:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
input[type=search],input[type=text],textarea,select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:400 16px/1.4 'Instrument Sans',system-ui,sans-serif;min-height:50px}
.search input{padding-left:44px}
textarea{min-height:100px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 14px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}

/* cards */
.grid{display:grid;gap:14px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.card{--a:#888;position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 16px 16px 20px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 16%,var(--surface)),var(--surface) 62%);overflow:hidden;transition:transform .15s,border-color .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--a)}
.card:hover{transform:translateY(-2px);border-color:var(--a)}
.card-top{display:flex;align-items:center;gap:12px}
.sw{width:46px;height:46px;border-radius:50%;background:var(--a);color:#0D0B14;display:grid;place-items:center;font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;flex:none}
.ct{flex:1;min-width:0}
.ct h3{font-size:20px}
.badge{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.card .tg{font-size:15px}
.card .sn{font-size:13px;color:var(--muted)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.card-actions .btn{flex:1 1 130px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

/* builder */
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--muted);font-weight:500;margin-top:14px}
.b-head{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.b-head h1{font-size:clamp(26px,5vw,38px)}
.b-head p{color:var(--muted)}
.b-grid{display:grid;gap:18px}
@media(min-width:900px){.b-grid{grid-template-columns:1fr 1fr;align-items:start}.b-out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.field{margin-bottom:18px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:50px;flex:1 1 68px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:500 15px 'Instrument Sans',system-ui,sans-serif;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:700}
.two{display:grid;gap:14px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
details.tips{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px}
details.tips summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details.tips ul{margin:0 0 12px;padding-left:20px;color:var(--muted)}
details.tips li{margin-bottom:6px}
.warn{display:flex;gap:12px;background:var(--warn-bg);border-left:4px solid var(--primary);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.warn svg{color:var(--primary);margin-top:2px}
.pbox{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;margin-bottom:12px}
.plabel{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--muted)}
.pbox pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 14px/1.65 'JetBrains Mono',ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}

/* wizard */
.wz{max-width:640px;margin:0 auto;padding-top:20px}
.wz h1{font-size:clamp(26px,5vw,36px);margin:8px 0 16px}
.prog{display:flex;gap:6px;margin-bottom:6px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--surface-2)}
.prog i.on{background:var(--primary)}
.opts{display:grid;gap:10px}
.opt{min-height:58px;text-align:left;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 16px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--primary);background:var(--surface-2)}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.res{margin-top:12px;display:grid;gap:12px}
.top-pick{border-radius:22px}
.why{color:var(--muted);font-size:14px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px}
tbody th{color:var(--muted);font-weight:600;width:112px}
td ul{margin:0;padding-left:16px}
.dur{display:inline-block;margin:0 4px 4px 0;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2)}
.dur.ok{color:var(--text)}
.dur.no{color:var(--muted);text-decoration:line-through}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* history */
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.hmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.hitem pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-word;font:400 13px/1.6 'JetBrains Mono',ui-monospace,Menlo,monospace;max-height:9.5em;overflow:hidden}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){#toast{bottom:28px}}
.note{font-size:13px;color:var(--muted);margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#app">Lewati ke konten</a>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="AI Creative Hub, beranda">
      <span class="mark" id="logo-mark"></span><span>AI Creative Hub</span>
    </a>
    <nav class="dnav" aria-label="Navigasi utama">
      <a href="#/" data-nav="home">Beranda</a>
      <a href="#/rekomendasi" data-nav="rekomendasi">Rekomendasi</a>
      <a href="#/bandingkan" data-nav="bandingkan">Bandingkan</a>

</header>
<main id="app" class="wrap" tabindex="-1"></main>
<nav class="bnav" aria-label="Navigasi bawah" id="bnav"></nav>

  const mood=p.mood||(g==='en'?'friendly':'ramah');
  return g==='en'
   ? JN('Avatar: a presenter looking directly at the camera, speaking in a '+mood+' tone, waist-up framing.','Setting: '+p.idea+'.','Script (about '+words+' words for '+p.dur+' seconds): "'+script+'"','Gestures: natural hand gestures and a friendly expression.',look(p,g))
   : JN('Avatar: seorang presenter menatap langsung ke kamera, berbicara dengan nada '+mood+', framing setengah badan.','Latar: '+p.idea+'.','Naskah (sekitar '+words+' kata untuk '+p.dur+' detik): "'+script+'"','Gestur: gerakan tangan natural dan ekspresi ramah.',look(p,g));
 }
};

function parts(F,g){
  const O=(arr,k)=>{const x=arr.find(i=>i.k===k);return(x&&x[g])||'';};
  const clean=s=>s.trim().replace(/[.!?\s]+$/,'');
  const idea0=clean(g==='en'?(F.ideaEn.trim()||F.idea):F.idea);
  const idea=idea0.charAt(0).toUpperCase()+idea0.slice(1);
  return {idea,style:O(STYLES,F.style),mood:O(MOODS,F.mood),light:O(LIGHTS,F.light),
    ratio:F.ratio,ratioText:RT[F.ratio][g],cam:O(CAMS,F.cam),extra:F.extra.trim(),extraClean:clean(F.extra),
    dur:F.dur,styleKey:F.style};
}
function build(t,F,g,seed){
  const p=parts(F,g);
  return (t.cat==='image'?IMG:VID)[t.fmt](p,g,seed,t);
}
function warnings(t,F){
  const w=[];
  if(t.cat==='video'&&t.maxDur&&F.dur>t.maxDur){
    const n=Math.ceil(F.dur/t.maxDur);const per=Math.ceil(F.dur/n);
    const sizes=[];let left=F.dur;for(let i=0;i<n;i++){const x=Math.min(per,left);sizes.push(x);left-=x;}
    w.push('Durasi '+F.dur+' detik melebihi batas '+t.durText+' di '+t.name+'. Saran: pecah menjadi '+n+' klip ('+sizes.join(' + ')+' detik), lalu pakai frame terakhir klip sebelumnya sebagai frame awal klip berikutnya agar adegan menyambung.');
  }
  if(t.id==='ideogram'&&!F.extra.trim()) w.push('Teks untuk gambar belum diisi. Ideogram paling kuat untuk tulisan, jadi isi kolom teks dan batasi beberapa kata saja.');
  if(t.id==='heygen'&&!F.extra.trim()) w.push('Naskah avatar belum diisi. Isi kolom naskah agar prompt siap dipakai.');
  return w;
}

function viewCompare(){
  const sel=S.cmp.map(TOOL);
  const chips=['image','video'].map(c=>'<p class="hint" style="margin:14px 0 6px">'+(c==='image'?'Image Generator':'Video Generator')+'</p><div class="chips" style="margin-top:0">'+
    TOOLS.filter(t=>t.cat===c).map(t=>'<button type="button" class="chip" data-cmp="'+t.id+'" aria-pressed="'+S.cmp.includes(t.id)+'">'+esc(t.name)+'</button>').join('')+'</div>').join('');
  const row=(label,fn)=>'<tr><th scope="row">'+label+'</th>'+sel.map(t=>'<td>'+fn(t)+'</td>').join('')+'</tr>';
  const durCell=t=>{
    if(t.cat==='image')return 'Tidak berlaku';
    return '<div>'+esc(t.durText)+'</div><div style="margin-top:6px">'+DURS.map(d=>'<span class="dur '+(d<=t.maxDur?'ok':'no')+'" title="'+(d<=t.maxDur?'Muat dalam satu klip':'Perlu dipecah')+'">'+d+' dtk</span>').join('')+'</div>';
  };
  let table='<div class="empty" style="margin-top:16px">Pilih minimal 2 tool untuk dibandingkan.</div>';
  if(sel.length>=2){
    table='<div class="tbl-wrap"><table><caption class="hint" style="text-align:left;padding:10px 14px;caption-side:bottom">Durasi dicoret berarti perlu dipecah menjadi beberapa klip.</caption><thead><tr><th scope="col"><span class="hint">Tool</span></th>'+sel.map(t=>'<th scope="col"><span class="dot" style="background:'+t.accent+'"></span>'+esc(t.name)+'</th>').join('')+'</tr></thead><tbody>'+
     row('Kategori',t=>t.cat==='image'?'Gambar':'Video')+
     row('Cocok untuk',t=>esc(t.bestFor))+
     row('Kelebihan',t=>'<ul>'+t.pros.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>')+
     row('Durasi',durCell)+
     row('Gaya prompt',t=>esc(t.styleNote))+
     row('Situs',t=>'<a href="'+t.url+'" target="_blank" rel="noopener noreferrer">Buka</a>')+
     row('Aksi',t=>'<a class="btn primary" style="min-height:44px" href="#/create/'+t.id+'">Buat Prompt</a>')+
     '</tbody></table></div>';
  }
  app.innerHTML='<div class="sec-h" style="margin-top:22px"><h2>Bandingkan tool</h2></div><p class="hint">Pilih 2 sampai 3 tool.</p>'+chips+table+'<p class="note">Batas durasi dan fitur bisa berubah. Cek situs resmi untuk info terbaru.</p>';
}

/* ---------- views: history ---------- */
function viewHistory(){
  const tabs=[['riwayat','Riwayat'],['prompt','Prompt favorit'],['tool','Tool favorit']];
  let h='<div class="sec-h" style="margin-top:22px"><h2>Riwayat &amp; Favorit</h2></div>'+
   '<div class="tabs" role="tablist">'+tabs.map(x=>'<button type="button" role="tab" data-hv="'+x[0]+'" aria-selected="'+(S.hv===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
  const item=(it,kind)=>{
    const t=TOOL(it.toolId);if(!t)return '';
    return '<article class="hitem" style="border-left:5px solid '+t.accent+'"><div class="hmeta"><strong style="color:var(--text)">'+esc(t.name)+(it.dur?' · '+it.dur+' detik':'')+'</strong><span>'+esc(fmtTime(it.ts))+'</span></div>'+
     '<pre>'+esc(it.en)+'</pre><div class="row"><button type="button" class="btn" data-hcopy="'+it.id+'" data-kind="'+kind+'">'+ic('copy',18)+'Salin</button>'+
     '<a class="btn" href="#/create/'+t.id+'">Buka tool</a>'+
     '<button type="button" class="btn ghost" data-del="'+kind+':'+it.id+'" aria-label="Hapus">'+ic('trash',18)+'Hapus</button></div></article>';
  };
  if(S.hv==='riwayat'){
    const l=getHist();
    h+=l.length?l.map(i=>item(i,'h')).join('')+'<div class="row" style="margin-top:16px"><button type="button" class="btn" data-del="h:all">'+ic('trash',18)+'Hapus semua riwayat</button></div>':'<div class="empty" style="margin-top:16px">Belum ada riwayat. Buat prompt pertamamu, nanti tersimpan di sini (hanya di perangkat ini).</div>';
  }else if(S.hv==='prompt'){
    const l=getFavP();
    h+=l.length?l.map(i=>item(i,'p')).join(''):'<div class="empty" style="margin-top:16px">Belum ada prompt favorit. Tekan “Simpan ke favorit” setelah membuat prompt.</div>';
  }else{
    const l=getFavT().map(TOOL).filter(Boolean);
    h+=l.length?'<div class="grid">'+l.map(cardHtml).join('')+'</div>':'<div class="empty" style="margin-top:16px">Belum ada tool favorit. Tekan ikon hati di kartu tool.</div>';
  }
  app.innerHTML=h;
}

/* ---------- router ---------- */
function route(){
  clearInterval(S.demoT);
  const h=location.hash.replace(/^#\/?/,'');
  const [a,b]=h.split('/');
  const nav=a==='create'||!a||a==='tools'?'home':a;
  $$('[data-nav]').forEach(el=>el.setAttribute('aria-current',el.dataset.nav===nav?'page':'false'));
  if(a==='create'&&TOOL(b))viewBuilder(TOOL(b));
  else if(a==='rekomendasi')viewWizard();
  else if(a==='bandingkan')viewCompare();
  else if(a==='riwayat')viewHistory();
  else viewHome();
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-tab],[data-chip],[data-fav],[data-opt],[data-wz],[data-cmp],[data-hv],[data-demo],[data-del],[data-hcopy],[data-scroll]');
  if(!el)return;
  const d=el.dataset;
  if(d.scroll){e.preventDefault();const t=document.getElementById(d.scroll);if(t)t.scrollIntoView({behavior:'smooth'});return;}
  if(d.demo!==undefined){clearInterval(S.demoT);demoShow(+d.demo);return;}
  if(d.tab){S.tab=d.tab;S.tag='all';updateHome();return;}
  if(d.chip){S.tag=d.chip;updateHome();return;}
  if(d.fav){
    let f=getFavT();const on=f.includes(d.fav);
    f=on?f.filter(x=>x!==d.fav):f.concat(d.fav);store.set('ach:favTools',f);
    $$('[data-fav="'+d.fav+'"]').forEach(b=>b.setAttribute('aria-pressed',String(!on)));
    toast(on?'Dihapus dari favorit':'Tool disimpan ke favorit');
    if(S.hv==='tool'&&location.hash.indexOf('riwayat')>-1)viewHistory();
    return;
  }
  if(d.opt){
    const id=(location.hash.split('/')[2])||'';const t=TOOL(id);if(!t)return;
    const F=S.forms[t.id];
    F[d.opt]=d.opt==='dur'?+d.val:d.val;
    $$('[data-opt="'+d.opt+'"]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.val===d.val)));
    updateHints(t);return;
  }
  if(d.act){
    const t=TOOL((location.hash.split('/')[2])||'');if(!t)return;
    if(d.act==='gen'||d.act==='regen'){generate(t);return;}
    if(!S.out)return;
    if(d.act==='copy-en'){copy(S.out.en,'Prompt Inggris disalin');return;}
    if(d.act==='copy-id'){copy(S.out.id,'Terjemahan disalin');return;}
    if(d.act==='save'){
      let f=getFavP();const ex=f.find(x=>x.en===S.out.en);
      if(ex){f=f.filter(x=>x.en!==S.out.en);toast('Dihapus dari favorit');}
      else{f.unshift({id:uid(),toolId:t.id,en:S.out.en,idt:S.out.id,ts:Date.now(),dur:t.cat==='video'?S.out.dur:null});toast('Prompt disimpan ke favorit');}
      store.set('ach:favPrompts',f.slice(0,100));renderOut(t);return;
    }
  }
  if(d.wz){
    const z=S.wz;const [k,v]=d.wz.split(':');
    if(d.wz==='reset'){S.wz={step:0,goal:null,mod:null,com:null};}
    else if(d.wz==='back'){z.step=Math.max(0,z.step-1);}
    else if(k==='goal'){z.goal=v;z.step=1;}
    else if(k==='mod'){z.mod=v;z.step=2;}
    else if(k==='com'){z.com=v;z.step=3;}
    renderWizard();window.scrollTo(0,0);return;
  }
  if(d.cmp){
    let c=S.cmp;
    if(c.includes(d.cmp))c=c.filter(x=>x!==d.cmp);
    else{if(c.length>=3){toast('Maksimal 3 tool');return;}c=c.concat(d.cmp);}
    S.cmp=c;viewCompare();return;
  }
  if(d.hv){S.hv=d.hv;viewHistory();return;}
  if(d.hcopy){
    const l=d.kind==='h'?getHist():getFavP();const it=l.find(x=>x.id===d.hcopy);
    if(it)copy(it.en,'Prompt disalin');return;
  }
  if(d.del){
    const [kind,id]=d.del.split(':');
    if(kind==='h'){store.set('ach:history',id==='all'?[]:getHist().filter(x=>x.id!==id));}
    else{store.set('ach:favPrompts',getFavP().filter(x=>x.id!==id));}
    toast('Dihapus');viewHistory();return;
  }
});

/* ---------- init ---------- */
$('#logo-mark').innerHTML=ic('sparkles',20);
$('#bnav').innerHTML=
 '<a href="#/" data-nav="home">'+ic('home')+'<span>Beranda</span></a>'+
 '<a href="#/rekomendasi" data-nav="rekomendasi">'+ic('sparkles')+'<span>Rekomendasi</span></a>'+
 '<a href="#/bandingkan" data-nav="bandingkan">'+ic('columns')+'<span>Bandingkan</span></a>'+
 '<a href="#/riwayat" data-nav="riwayat">'+ic('clock')+'<span>Riwayat</span></a>';
setTheme(store.get('ach:theme','dark')==='light'?'light':'dark');
$('#theme').addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
window.addEventListener('hashchange',route);
route();
})();
</script>
